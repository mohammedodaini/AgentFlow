# =============================================================================
# CI pipeline: every push/PR runs the exact same gate as `make check`.
# If it isn't checked in CI, it will eventually break in production.
# =============================================================================
name: CI

on:
  # A schedule as well as pushes, and only the supply-chain job needs it: a
  # vulnerability is published against code that has not changed. A gate that
  # runs only on push says "green" for as long as nobody commits, which is
  # exactly the period during which an unpatched dependency is sitting in
  # production unnoticed.
  schedule:
    - cron: "17 6 * * 1"
  push:
    # `master`, not `main`. The scaffold said `main` and this repository's branch
    # is `master`, so from M1 until M13 no *push* ever triggered this workflow —
    # only pull requests did, and this project has not opened one. A CI file that
    # never runs is worse than none: it looks like a gate.
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agentflow
          POSTGRES_PASSWORD: agentflow
          POSTGRES_DB: agentflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentflow"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        # `.`, not `app` — 259 files including every test. This once read `app`
        # and was widened by a production audit; the comment then claimed the
        # local gate was the stricter of the two, which was the opposite of the
        # truth. `make typecheck` ran `mypy app` until a TLS drill noticed the
        # file counts did not match. Both now check the same thing, which is the
        # only arrangement where a green local run means anything.
        run: uv run mypy .

      - name: Migrations match the models
        env: &backend_env
          DATABASE_URL: postgresql+asyncpg://agentflow:agentflow@localhost:5432/agentflow_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-only-secret
        # `alembic check` asks "would autogenerate produce anything?" — the cheap
        # version of "did somebody change a model and forget the migration?".
        # That drift is invisible until a deploy runs against a real database,
        # because `create_all` in the test fixtures papers over it.
        #
        # **Before the tests, and the order is load-bearing.** The suite builds
        # its schema with `create_all` and never stamps `alembic_version`, so a
        # database it has touched has every table and an empty version table —
        # and `alembic upgrade head` then replays migration 1 into a schema that
        # already exists and dies on `DuplicateTableError: relation
        # "organizations" already exists`. This step was written after the tests
        # the first time and failed for exactly that reason.
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Tests
        env: *backend_env
        run: uv run pytest

      - name: Evaluation gate
        env: *backend_env
        # `docs/agents.md`: "No prompt change ships without the evaluation harness
        # confirming no regression on the golden set." That was true of the local
        # `make eval` and not enforced anywhere a push could see it, which made it
        # a convention rather than a gate. It runs the routing set first (no
        # database, no model, milliseconds) and then the handbook set.
        run: uv run python -m app.evaluation

  # ---------------------------------------------------------------------------
  # M13. A separate job rather than steps appended to `backend`, for two reasons:
  # it needs a different toolchain (pnpm, not uv) and no database at all, and
  # keeping them apart means a backend failure and a frontend failure are
  # distinguishable at a glance instead of being one red X.
  #
  # The browser smoke test is deliberately *not* here. It needs the API, the arq
  # worker, Postgres and Redis all running together, and a CI job that stands the
  # whole system up is a different kind of job — slower, and failing for reasons
  # that are usually about the harness. `make smoke` is run by hand before a
  # release until that is worth automating.
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        # `--frozen-lockfile` so a lockfile that drifted from package.json fails
        # here rather than resolving to something nobody tested locally.
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Supply chain. Three questions the other two jobs do not ask:
  #
  #   1. Does anything we depend on have a *published* vulnerability?
  #   2. Is there a secret in this repository — including in history?
  #   3. Does the lockfile still agree with the manifest?
  #
  # A separate job because it is the only one that runs on a schedule, and
  # because its failures are a different kind: `mypy` failing means somebody
  # broke something, and this failing usually means the world changed.
  #
  # **It is a real gate, not `continue-on-error`.** A red build for a CVE in a
  # transitive dependency is disruptive, and that is the point — the alternative
  # is a warning nobody reads. `.github/dependabot.yml` is what makes it
  # clearable: the PR that fixes it is usually already open. When a fix does not
  # exist yet, `--ignore-vuln GHSA-xxxx-xxxx-xxxx` with a comment naming the
  # advisory, why it does not apply here, and when to look again is the escape
  # hatch. An undocumented ignore is how a real vulnerability becomes permanent.
  # ---------------------------------------------------------------------------
  supply-chain:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # **The whole history, and this is the point of the scan.** A secret
          # that was committed and later deleted is still in the pack file and
          # still fetchable by anyone with clone access — and still valid until
          # somebody rotates it. Scanning only the tip would report the one
          # state where it is guaranteed absent.
          fetch-depth: 0

      - name: Secret scan
        # The upstream image, run directly and pinned to a version, rather than
        # `gitleaks/gitleaks-action`. Two reasons: the action asks for a licence
        # key under an organization account, and a third-party action runs with
        # a token that can write to this repository, which is the same class of
        # risk this job exists to find.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1 \
            detect --source . --redact --no-banner -c /repo/.gitleaks.toml

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: The lockfile matches the manifest
        working-directory: backend
        # `--check` resolves and compares without writing. Without it, a
        # `pyproject.toml` edited without re-locking means CI installs one set
        # of versions and `docker build` — which uses `uv sync --frozen` —
        # installs another, or refuses to build. That divergence was an M16 bug
        # in the other direction: the production image ignored the lockfile
        # entirely and re-resolved on every build.
        run: uv lock --check

      - name: Python dependencies have no known vulnerabilities
        working-directory: backend
        # Audited from the *lockfile*, exported, rather than from an installed
        # environment. It is the lockfile that determines what ships, and it
        # includes transitive pins that no manifest names.
        run: |
          uv export --format requirements-txt --all-extras --no-emit-project -o requirements.audit.txt
          uvx pip-audit -r requirements.audit.txt --disable-pip

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend dependencies have no known vulnerabilities
        working-directory: frontend
        # `high` and above. `pnpm audit` at `low` reports advisories against
        # build-time packages that never reach a browser, and a gate that is
        # red for a prototype-pollution note in a transitive dev dependency is
        # a gate that gets switched off in a month.
        run: pnpm audit --audit-level high
