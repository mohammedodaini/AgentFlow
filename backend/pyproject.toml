# =============================================================================
# Single source of truth for the backend: package metadata, dependencies,
# and ALL tool configuration (ruff, mypy, pytest). Modern Python projects
# consolidate here instead of scattering setup.py / requirements.txt /
# setup.cfg / .flake8 / mypy.ini across the repo.
# =============================================================================

[project]
name = "agentflow-backend"
version = "0.1.0"
description = "AgentFlow AI — an AI employee for small businesses"
requires-python = ">=3.13"
dependencies = [
    # --- Web framework ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",     # form / file uploads
    # --- Settings & validation ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # --- Database ---
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    # --- Auth ---
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "authlib>=1.3",                  # OAuth client flows
    # --- Redis & background work ---
    "redis>=5.2",
    "arq>=0.26",                     # async task queue on Redis
    # --- LLM / agents (added when we reach those milestones) ---
    "anthropic>=0.40",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # --- Observability ---
    "structlog>=24.4",
    # --- HTTP client for integrations ---
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "faker>=33.0",
]

# --- Ruff: linter + formatter (replaces flake8, isort, black) ---
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort (import ordering)
    "B",        # bugbear (likely bugs)
    "UP",       # pyupgrade (modern syntax)
    "S",        # bandit (security)
    "SIM",      # simplify
    "PL",       # pylint subset
]
ignore = ["PLR0913"]  # "too many arguments" fights with dependency injection

[tool.ruff.lint.per-file-ignores]
# S101 asserts and PLR2004 literals are the point of a test.
# S105/S106 flag hardcoded passwords — correct in application code, noise in
# fixtures that need a `password_hash` value and must never use a real one.
"tests/*" = ["S101", "PLR2004", "S105", "S106"]

# Without this, `app` sorts as a third-party package and our own imports get
# shuffled in among fastapi/httpx. Import grouping is only useful when the
# first-party group is actually first-party.
[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

# --- Mypy: static type checking ---
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
