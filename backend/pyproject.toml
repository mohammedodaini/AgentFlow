# =============================================================================
# Single source of truth for the backend: package metadata, dependencies,
# and ALL tool configuration (ruff, mypy, pytest). Modern Python projects
# consolidate here instead of scattering setup.py / requirements.txt /
# setup.cfg / .flake8 / mypy.ini across the repo.
# =============================================================================

[project]
name = "agentflow-backend"
version = "0.1.0"
description = "AgentFlow AI — an AI employee for small businesses"
requires-python = ">=3.13"
dependencies = [
    # --- Web framework ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",     # form / file uploads
    # --- Settings & validation ---
    # [email] pulls in email-validator, which backs pydantic's EmailStr.
    # Validating addresses at the API boundary (M3) beats discovering a
    # malformed one when a password-reset email silently fails to send.
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    # --- Database ---
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    # --- Document parsing (M5) ---
    "pypdf>=5.1",                    # pure-python PDF text extraction
    # --- Retrieval (M6) ---
    "tiktoken>=0.8",                 # token counting, so chunk budgets are real
    "openai>=1.57",                  # embeddings only; Claude is the generation model
    # --- Auth ---
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "authlib>=1.3",                  # OAuth client flows
    # M11. Fernet, for OAuth tokens at rest. Declared explicitly even though
    # authlib already pulls it in: a transitive dependency is one an upgrade
    # upstream can remove, and discovering that at import time in production is
    # how a deploy fails for a reason nobody changed.
    "cryptography>=44",
    # --- Redis & background work ---
    "redis>=5.2",
    "arq>=0.26",                     # async task queue on Redis
    # --- LLM / agents (added when we reach those milestones) ---
    "anthropic>=0.40",               # M7. Only app/llm/anthropic.py may import it
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # --- Observability ---
    "structlog>=24.4",
    # --- HTTP client for integrations ---
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "faker>=33.0",
]

# --- Ruff: linter + formatter (replaces flake8, isort, black) ---
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort (import ordering)
    "B",        # bugbear (likely bugs)
    "UP",       # pyupgrade (modern syntax)
    "S",        # bandit (security)
    "SIM",      # simplify
    "PL",       # pylint subset
]
# Both rules count parameters, and both are wrong about dependency injection: a
# FastAPI route's parameters are *injected by name*, never passed positionally,
# so a six-argument route signature is a declaration of what it needs rather
# than a call site anyone has to remember the order of. Obeying them would mean
# bundling unrelated dependencies into a container object purely to satisfy a
# linter — strictly worse, because it hides from the framework what the
# endpoint actually depends on.
ignore = ["PLR0913", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
# S101 asserts and PLR2004 literals are the point of a test.
# S105/S106 flag hardcoded passwords — correct in application code, noise in
# fixtures that need a `password_hash` value and must never use a real one.
"tests/*" = ["S101", "PLR2004", "S105", "S106"]

# Without this, `app` sorts as a third-party package and our own imports get
# shuffled in among fastapi/httpx. Import grouping is only useful when the
# first-party group is actually first-party.
[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

# --- Mypy: static type checking ---
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# --strict-markers: a typo'd marker fails the run instead of silently
#   selecting nothing, which is how "we run the integration suite in CI"
#   quietly becomes "we run zero tests in CI".
# The coverage threshold lives in [tool.coverage.report] below, not here, so
# `coverage report` run by hand enforces the same number pytest does.
addopts = "--cov=app --cov-report=term-missing --strict-markers"
markers = [
    "unit: no I/O at all — pure functions and in-memory objects (milliseconds)",
    "integration: talks to a real PostgreSQL/Redis (tens of milliseconds)",
    "e2e: drives the app over HTTP through the full stack (hundreds)",
]

# --- Coverage ---
[tool.coverage.run]
source = ["app"]
branch = true  # 'if x:' counts as covered only when both outcomes are taken

# SQLAlchemy's asyncio layer runs its work inside greenlets (greenlet_spawn).
# Without this, every line executed under `await session.execute(...)` is
# invisible to coverage: the service layer reported 57% while end-to-end tests
# were demonstrably exercising it, and the "uncovered" lines were things like
# `return membership` on the hottest path in the application.
# A coverage gate that under-reports is worse than none — it teaches people to
# distrust the number.
concurrency = ["greenlet", "thread"]

# Modules that are still scaffolding: imports, docstrings and milestone TODOs
# with no class or function in them. Counting them would peg total coverage to
# how much of the roadmap is built rather than how well the built part is
# tested — a number that falls every time someone adds a stub, and that no one
# can act on.
#
# This list cannot go stale unnoticed: tests/unit/test_stub_manifest.py
# reconciles it against the source tree in both directions, so implementing a
# module while leaving it here fails the suite.
# M5 note: `app/rag/**`, `app/repositories/**` and `app/workers/**` used to be
# blanket globs. They are now per-file, because M5 implements one module inside
# each of those packages and a directory glob would have hidden all three from
# the gate — the precise failure test_stub_manifest.py exists to catch. A
# package-wide omit is only ever safe while the package is entirely empty.
omit = [
    # M9 note: `app/agents/**` was a blanket glob and could not stay one — the
    # package now holds implemented modules (state.py, rag/) beside seven
    # still-stubbed agents, and a directory glob would have hidden the
    # implemented ones from the gate. The same correction M5 made for `rag/`.
    # M12 delisted `app/agents/calendar/*` and the five approval modules below.
    # M14 delisted `app/agents/email/*` — the half M12 deferred, because there was
    # no Gmail integration to draft into. There is one now.
    # M15 delisted `app/agents/planner/*` and `app/agents/supervisor/*`. The four
    # below stay, and each for a reason rather than for lack of time:
    # `evaluation/` and `memory/` are graphs that were never needed — M8 put
    # evaluation in a runner and M10 put extraction in a worker task, both
    # deliberately, because neither has a branch to be a graph about. `research/`
    # needs a web search tool this environment cannot have, and `proposal/` is a
    # template renderer nobody has asked for.
    "app/agents/evaluation/*.py",
    "app/agents/memory/*.py",
    "app/agents/proposal/*.py",
    "app/agents/research/*.py",
    # M10 delisted twelve entries from here: `app/memory/**`, the memory
    # repository, the three new models and their schemas, the conversation
    # service and route, and the extraction task. `app/agents/memory/*` stays —
    # that graph is still scaffolding, because M10 put extraction in a worker
    # task rather than a graph. It has no branches to be a graph about.
    # M11 note: `app/integrations/**` was a blanket glob and could not stay one —
    # the fourth time this correction has been needed in this file (M5 for
    # `rag/`, M9 for `agents/`, M10 for `memory/`). The package now holds
    # implemented modules (base.py, offline.py, google_calendar/) beside six
    # unbuilt providers, and a directory glob would have hidden the implemented
    # ones from the gate. That is precisely the failure test_stub_manifest.py
    # exists to catch, and it caught it.
    # M14 delisted five of those six: gmail, slack, notion, github and stripe.
    # `google_drive` stays, and it is the only provider left — nothing in this
    # product reads a file from Drive, so connecting it would produce an
    # integration with no endpoint to call. It is absent from
    # `SUPPORTED_PROVIDERS` for the same reason.
    "app/integrations/google_drive/*.py",
    "app/workers/tasks/agent_execution.py",
    "app/workers/tasks/email_sync.py",
    "app/middleware/rate_limit.py",
    "app/monitoring/metrics.py",
    "app/models/event.py",
]

[tool.coverage.report]
# A ratchet, not a target: it records the floor already reached, so a change
# that drops coverage fails loudly. Raise it when a milestone clears it by a
# margin; never lower it to make a red build green.
#
# Two points below the current 99% — enough slack that adding a defensive
# branch does not fail the build, tight enough that deleting a test does.
# Chasing 100% is how suites fill with tests that assert nothing.
fail_under = 97
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",             # never executed at runtime
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",                     # Protocol/overload bodies
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
