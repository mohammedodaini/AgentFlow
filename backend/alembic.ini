# =============================================================================
# Alembic configuration. Deliberately trimmed from the generated template —
# the stock file is 150 lines of commented-out options, which makes the ~10
# lines actually in force impossible to spot.
#
# Run from `backend/`:  make migrate  ·  make makemigration m="add documents"
# =============================================================================

[alembic]
script_location = %(here)s/alembic

# Filenames get a timestamp prefix so `ls versions/` shows history in order.
# Without it you get `a3f9c21b_add_users.py` next to `0c4e8d12_add_docs.py`
# and no way to tell which came first without opening both.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Puts `backend/` on sys.path so env.py can `import app`.
prepend_sys_path = .
path_separator = os

# NOTE: there is deliberately no `sqlalchemy.url` here.
# env.py sets it from Settings, so the connection string has exactly one
# definition in the project — and no password ever lands in a committed file.


# Generated migrations are source files and must pass the same gate as
# everything else. Formatting them at generation time beats discovering it in
# CI, and beats hand-fixing a 200-line autogenerated diff.
[post_write_hooks]
# Order matters: format first (it fixes the long lines autogenerate emits),
# then lint. The other way round, `check` reports E501 on lines that `format`
# is about to wrap anyway.
hooks = ruff_format, ruff_check

ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME


# --- Logging (consumed by env.py's fileConfig call) ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
